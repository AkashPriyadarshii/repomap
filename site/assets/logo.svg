<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="repomap logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1610"/>
      <stop offset="1" stop-color="#050d09"/>
    </linearGradient>
    <linearGradient id="rm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- rounded-square shell -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-opacity="0.22" stroke-width="6"/>
  <!-- rm = repomap -->
  <text x="256" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="224" font-weight="700" fill="url(#rm)" text-anchor="middle">rm</text>
  <!-- ranked files: bars shrink by score -->
  <rect x="120" y="312" width="272" height="22" rx="11" fill="#34d399"/>
  <rect x="120" y="344" width="196" height="22" rx="11" fill="#10b981" fill-opacity="0.75"/>
  <rect x="120" y="376" width="124" height="22" rx="11" fill="#059669" fill-opacity="0.55"/>
  <!-- token-budget cut: dashed cap line -->
  <line x1="316" y1="302" x2="316" y2="408" stroke="#e1ece6" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
