name: publish site
on:
  push:
    branches: [master]
    paths: [site/**, assets/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bundle logo into site
        run: mkdir -p site/assets && cp assets/logo.svg site/assets/
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: deploy
        uses: actions/deploy-pages@v4
