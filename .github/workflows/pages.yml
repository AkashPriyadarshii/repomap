name: publish repo map page
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build repomap
        run: go build -o repomap ./cmd/repomap
      - name: generate searchable index
        run: ./repomap --index --index-title "repomap — repo map for AI agents" -o index.html .
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: deploy
        uses: actions/deploy-pages@v4
